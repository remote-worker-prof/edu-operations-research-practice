format: student_math_v2

extension:
  alias: study_planner
  title: Study Planner
  description: >-
    Учебное расширение для постановки и решения простой LP-задачи:
    распределить ограниченный запас учебных часов по курсам так, чтобы получить
    максимальную суммарную полезность.
  version: 0.4.0
  default_preset: demo
  labels:
    total_available_hours: Всего часов в распоряжении
    total_required_hours: Всего часов нужно
    total_used_hours: Сколько часов распределили
    remaining_hours: Сколько часов осталось
    achieved_weighted_score: Суммарная полезность плана
    course_plan: План по курсам
    course_plan.course: Курс
    course_plan.required_hours: Нужно часов
    course_plan.allocated_hours: Запланировано часов
    course_plan.gap_hours: Дефицит часов
    course_plan.priority: Вес приоритета
    course_plan.completion_ratio: Доля выполнения
    course_plan.completion_ratio_pct: Выполнение, %

inputs:
  - id: courses
    label: Курсы
    table:
      set: COURSES
      key:
        field: course_names
        label: Названия курсов
        help: Перечислите курсы в том порядке, в котором будете задавать остальные списки.
        example: Math
        aliases:
          - names
      columns:
        - param: required_hours
          field: required_hours
          label: Требуемые часы
          help: Сколько часов нужно, чтобы полностью закрыть каждый курс.
          type: number
          min: 0.0001
          example: 30
          aliases:
            - hours_needed
  - id: time_budget
    label: Бюджет времени
    aliases:
      - budget
      - time budget
      - бюджет времени
    params:
      - param: weekly_hours
        field: weekly_hours
        label: Часов в неделю
        help: Реалистичный недельный лимит самостоятельной учебы.
        type: number
        min: 0.0001
        example: 12
        aliases:
          - hours_per_week
      - param: weeks
        field: weeks
        label: Количество недель
        help: Сколько недель длится ваш план.
        type: number
        min: 0.0001
        example: 4
        aliases:
          - study_weeks
  - id: priorities
    label: Приоритеты
    vectors:
      - param: priority
        over: COURSES
        field: priority
        label: Веса приоритетов
        help: Чем выше число, тем полезнее дополнительный час на этом курсе.
        type: number
        min: 0.0001
        example:
          - 0.5
          - 0.3
          - 0.2
        aliases:
          - weights
          - priority_weights

display:
  summary:
    - id: total_available_hours
      expr: available_hours
    - id: total_required_hours
      expr: sum{c in COURSES} required_hours[c]
    - id: total_used_hours
      expr: sum{c in COURSES} study_hours[c]
    - id: remaining_hours
      expr: available_hours - sum{c in COURSES} study_hours[c]
    - id: achieved_weighted_score
      expr: sum{c in COURSES} priority[c] * study_hours[c]
  tables:
    - id: course_plan
      rows: c in COURSES
      columns:
        - id: course
          expr: c
        - id: required_hours
          expr: required_hours[c]
        - id: allocated_hours
          expr: study_hours[c]
        - id: gap_hours
          expr: required_hours[c] - study_hours[c]
        - id: priority
          expr: priority[c]
        - id: completion_ratio
          expr: study_hours[c] / required_hours[c]
        - id: completion_ratio_pct
          expr: 100 * study_hours[c] / required_hours[c]

presets:
  demo: presets/demo.yaml
