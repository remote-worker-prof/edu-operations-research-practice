[project]
name = "or-core"
version = "0.1.0"
description = "Deterministic operations research pipeline for educational LangGraph demos"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.11.2",
  "scipy>=1.13.1",
  "networkx>=3.3",
  "ortools>=9.11.4210",
  "langgraph>=0.2.53",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/or_core"]
