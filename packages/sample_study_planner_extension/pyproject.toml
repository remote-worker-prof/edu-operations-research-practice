[project]
name = "sample-study-planner-extension"
version = "0.1.0"
description = "Compatibility adapter for the declarative study_planner extension"
requires-python = ">=3.11,<3.13"
dependencies = [
  "agent-core",
  "extension-api",
]

[tool.uv.sources]
agent-core = { workspace = true }
extension-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_study_planner_extension"]
