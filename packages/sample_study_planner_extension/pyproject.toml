[project]
name = "sample-study-planner-extension"
version = "0.1.0"
description = "Sample deterministic study-planner extension for the educational agent"
requires-python = ">=3.11,<3.13"
dependencies = [
  "extension-api",
]

[project.entry-points."edu_or_agent.extensions"]
study_planner = "sample_study_planner_extension:StudyPlannerExtensionProvider"

[tool.uv.sources]
extension-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_study_planner_extension"]
